<!DOCTYPE html>
<html>
<head>
<title>Tasks</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
        text-align: center;
        color: #333;
    }

    h2 {
        margin-top: 50px;
        font-size: 32px;
        color: #222;
    }

    button {
        background: #f1f3f5;
        color: #333;
        border: none;
        padding: 12px 20px;
        margin: 10px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    button:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
    }

    button:active {
        transform: scale(0.95);
    }

    /* Dashboard button style */
    button:last-of-type {
        background: #ff6b6b;
        color: white;
    }

    button:last-of-type:hover {
        background: #ff3b3b;
    }

</style>

</head>

<body>

<h2>Practice Tasks</h2>

<button onclick="goTask('eye_contact.html')">Eye Contact</button>
<button onclick="goTask('fluency_drill.html')">Fluency Drill</button>
<button onclick="goTask('power_pose.html')">Power Pose</button>
<button onclick="goTask('star_training.html')">STAR Training</button>

<br><br>
<button onclick="goDashboard()">Back to Dashboard</button>

<script>
function goTask(page){
    window.location.href = "./" + page;
}

function goDashboard(){
    window.location.href = "./dashboard.html";
}
</script>

</body>
</html>
