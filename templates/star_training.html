<!DOCTYPE html>
<html>
<head>
    <title>STAR Method Rebuilder</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 80px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; padding: 10px; }
        .btn { background: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Structured Answer Rebuild (STAR)</h2>
        <p><strong>Prompt:</strong> Tell me about a time you handled a difficult team member.</p>
        
        <label><strong>S</strong>ituation:</label>
        <textarea placeholder="Where were you?"></textarea>
        
        <label><strong>T</strong>ask:</label>
        <textarea placeholder="What was the specific problem?"></textarea>
        
        <label><strong>A</strong>ction:</label>
        <textarea placeholder="What steps did YOU take?"></textarea>
        
        <label><strong>R</strong>esult:</label>
        <textarea placeholder="What was the final outcome?"></textarea>
        
        <button class="btn" onclick="alert('Analysis Saved! Your structure score increased by 15%.')">Submit for Analysis</button>
        <br><br>
        <a href="/">← Back to Dashboard</a>
    </div>
</body>
</html>
